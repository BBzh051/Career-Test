<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进阶测试｜行为决策模式分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
body{
  background:linear-gradient(135deg,#0ea5e9,#22c55e);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px
}
.container{
  background:#fff;
  border-radius:20px;
  max-width:860px;
  width:100%;
  padding:42px;
  box-shadow:0 12px 30px rgba(0,0,0,.15)
}
h1{text-align:center;margin-bottom:10px;color:#0f172a}
.subtitle{text-align:center;color:#64748b;margin-bottom:30px}

.page{display:none}
.page.active{display:block}

.question{
  font-size:18px;
  font-weight:bold;
  margin-bottom:22px;
  line-height:1.6;
  color:#0f172a
}
.option{
  border:2px solid #e5e7eb;
  border-radius:12px;
  padding:14px 18px;
  margin-bottom:14px;
  cursor:pointer;
  transition:.2s;
  color:#334155
}
.option:hover{
  background:#f0f9ff;
  border-color:#38bdf8
}

.btn{
  margin-top:30px;
  width:100%;
  padding:15px;
  font-size:17px;
  font-weight:bold;
  background:#0f172a;
  color:#fff;
  border:none;
  border-radius:12px;
  cursor:pointer
}

.result-title{
  text-align:center;
  font-size:26px;
  margin-bottom:6px
}
.result-subtitle{
  text-align:center;
  color:#64748b;
  margin-bottom:30px;
  font-size:14px
}

.section{
  background:#f8fafc;
  border-left:5px solid #0284c7;
  padding:24px;
  margin-bottom:24px;
  border-radius:0 12px 12px 0;
  line-height:1.8
}
.section h3{
  margin-bottom:10px;
  color:#0f172a;
  font-size:18px
}
.highlight{font-weight:bold;color:#0284c7}
</style>
</head>

<body>
<div class="container">

<!-- intro -->
<div id="intro" class="page active">
<h1>🔍 行为决策模式分析（进阶版）</h1>
<p class="subtitle">看清你是怎么一步步把自己卡住的</p>

<p><strong>Hi，欢迎来到职业规划进阶测试。</strong></p>
<p>如果你在之前的测试中找到了优势领域，却依然感到：</p>
<ul>
<li>犹豫不决，迟迟无法开始</li>
<li>尝试了很多，却总觉得没有积累</li>
<li>容易受外界影响，不知道自己想要什么</li>
</ul>
<p>这个测试会聚焦在你<strong>真实的决策行为</strong>上，  
不是告诉你“适合什么”，而是找出那个反复拖慢你进展的<strong>隐形路障</strong>。</p>

<button class="btn" onclick="start()">开始深度分析</button>
</div>

<!-- test -->
<div id="test" class="page">
<div id="qtext" class="question"></div>
<div id="options"></div>
</div>

<!-- result -->
<div id="result" class="page">
<div class="result-title" id="rtype"></div>
<div class="result-subtitle" id="rsubtitle"></div>

<canvas id="radarChart" style="margin-bottom:40px;"></canvas>

<div class="section">
<h3>你当前的行为状态</h3>
<p id="rstate"></p>
</div>

<div class="section">
<h3>你正在面对的核心困境</h3>
<p id="rrisk"></p>
</div>

<div class="section">
<h3>接下来真正重要的事</h3>
<p class="highlight" id="rnext"></p>
</div>

<button class="btn" onclick="location.reload()">重新测试</button>
</div>

</div>

<script>
let scores={fox:0,turtle:0,monkey:0,sheep:0};
let idx=0;

const questions=[
{
q:"你已经连续几个月对现状不满意，也反复想过改变，但一直没有真正行动。这时出现一个不确定但有潜力的新机会，你更可能：",
o:[
["先用最小成本试一下，哪怕只是获得一些真实反馈",{fox:1,monkey:1}],
["反复评估风险，暂时不行动",{turtle:1}],
["被新的想法吸引，很快开始考虑别的可能",{monkey:1}],
["先观察别人怎么做，再决定是否跟进",{sheep:1}],
["这种情况我很少遇到 / 都不像我",null]
]
},
{
q:"你已经投入过一个方向一段时间，但开始感到困难和不确定，你更真实的反应是：",
o:[
["停下来重新判断这个方向值不值得继续",{fox:1}],
["担心继续下去会不会影响稳定性",{turtle:1}],
["逐渐把精力转向新的尝试",{monkey:1}],
["询问他人的建议来确认是否该坚持",{sheep:1}],
["以上都不太符合",null]
]
},
{
q:"当你需要做一个重要选择时，你最容易卡在：",
o:[
["分析阶段，总觉得还不够确定",{fox:1}],
["决策阶段，担心选错带来后果",{turtle:1}],
["执行阶段，容易分心或转向",{monkey:1}],
["确认阶段，需要外界认可",{sheep:1}],
["不太清楚",null]
]
},
{
q:"如果你回看过去一年，最符合你真实状态的是：",
o:[
["想法和判断很多，但真正落地的不多",{fox:1}],
["整体偏稳，但内心有压抑感",{turtle:1}],
["做了不少事，但方向比较分散",{monkey:1}],
["一直在参考别人的路径做选择",{sheep:1}],
["以上都不是",null]
]
}
];

// 复制填充到 20 题（结构一致，避免疲劳）
while(questions.length<20){
questions.push(JSON.parse(JSON.stringify(questions[questions.length-4])));
}

function start(){
document.getElementById("intro").classList.remove("active");
document.getElementById("test").classList.add("active");
render();
}

function render(){
const q=questions[idx];
document.getElementById("qtext").innerText=`${idx+1}. ${q.q}`;
const box=document.getElementById("options");
box.innerHTML="";
q.o.forEach(opt=>{
const d=document.createElement("div");
d.className="option";
d.innerText=opt[0];
d.onclick=()=>{
if(opt[1]){
for(const k in opt[1]) scores[k]+=opt[1][k];
}
idx++;
idx<questions.length?render():show();
};
box.appendChild(d);
});
}

function show(){
document.getElementById("test").classList.remove("active");
document.getElementById("result").classList.add("active");

const type=Object.keys(scores).reduce((a,b)=>scores[a]>scores[b]?a:b);

const data={
fox:{
title:"🦊 想得比做得快的狐狸",
sub:"职场状态：高潜力但迟迟未落地",
state:"你对方向、价值和潜力有很强的判断力，但在面对不确定性时，往往选择继续分析而不是启动行动。你并不是缺乏能力，而是过度希望在行动前获得足够确定性，这让你长期停留在“准备阶段”。",
risk:"如果这种状态持续，你会越来越擅长分析，却越来越难真正开始。潜力长期得不到验证，容易逐渐转化为自我怀疑，甚至开始怀疑自己是否真的“能行”。",
next:"你真正需要解决的不是能力或方向，而是：如何在不完美、不确定的情况下，建立一个低风险的验证机制。"
},
turtle:{
title:"🐢 总想走稳一点的乌龟",
sub:"职场状态：安全感优先的谨慎型",
state:"你在做选择时高度关注风险与稳定性，对不确定性非常敏感。你并不是没有想法，而是很难在没有安全保障的情况下全力投入任何方向。",
risk:"如果长期回避不确定性，你的选择权会慢慢被环境和现实条件替你做出。看似稳定，实则逐渐失去主动权。",
next:"你接下来要厘清的，是自己真正可以承受的风险区间，而不是无限放大潜在风险。"
},
monkey:{
title:"🐒 什么都试过的猴子",
sub:"职场状态：行动力强但路径分散",
state:"你不害怕行动，也愿意尝试新方向，但容易在多个选择之间频繁切换。你的问题不是不努力，而是行动缺乏聚焦。",
risk:"如果行动无法形成累积，努力会逐渐变成消耗，最终让你感到疲惫和迷茫。",
next:"你需要学会判断哪些事情值得继续深化，哪些应该及时止损，而不是一味增加尝试。"
},
sheep:{
title:"🐑 总在参考别人路线的羊",
sub:"职场状态：判断依赖外部参考",
state:"你在做选择时非常重视外界信息、建议和成功案例，但很难完全信任自己的判断。方向往往来自比较，而不是内在确认。",
risk:"长期依赖外部标准，会让你越来越不确定自己真正想要什么，也更容易在关键节点犹豫不决。",
next:"你接下来最重要的不是再找一个标准答案，而是建立一个你愿意相信的判断体系。"
}
};

const r=data[type];
document.getElementById("rtype").innerText=r.title;
document.getElementById("rsubtitle").innerText=r.sub;
document.getElementById("rstate").innerText=r.state;
document.getElementById("rrisk").innerText=r.risk;
document.getElementById("rnext").innerText=r.next;

// radar chart
new Chart(document.getElementById("radarChart"),{
type:"radar",
data:{
labels:["高潜力-低落地","安全焦虑","行动混乱","外部依赖"],
datasets:[{
data:[scores.fox,scores.turtle,scores.monkey,scores.sheep],
backgroundColor:"rgba(2,132,199,0.2)",
borderColor:"#0284c7",
pointBackgroundColor:"#0284c7"
}]
},
options:{
scales:{r:{beginAtZero:true,ticks:{display:false}}},
plugins:{legend:{display:false}}
}
});
}
</script>

</body>
</html>
