function start() {
  document.getElementById("intro").classList.remove("active");
  document.getElementById("test").classList.add("active");
  render();
}

function render() {
  const q = questions[idx];
  document.getElementById("qNum").innerText = `Question ${idx+1} / 20`;
  document.getElementById("qtext").innerText = q.q;
  document.getElementById("progressBar").style.width = ((idx+1)/20*100)+"%";
  
  const box = document.getElementById("options");
  box.innerHTML = "";
  q.o.forEach(opt => {
    const d = document.createElement("div");
    d.className = "option";
    d.innerText = opt[0];
    d.onclick = () => {
      if(opt[1]) {
        for(const k in opt[1]) types[k] += opt[1][k];
      }
      idx++;
      if(idx < questions.length) {
        render();
      } else {
        showResult();
      }
    };
    box.appendChild(d);
  });
}

function showResult() {
  document.getElementById("test").classList.remove("active");
  document.getElementById("result").classList.add("active");

  // 找出最高分类型
  const maxType = Object.keys(types).reduce((a,b) => types[a] > types[b] ? a : b);
  const data = resultData[maxType];

  // 填充内容
  document.getElementById("rtype").innerText = data.title;
  document.getElementById("rsubtitle").innerText = data.sub;
  document.getElementById("rstate").innerHTML = data.state;
  document.getElementById("rwhy").innerHTML = data.why;
  document.getElementById("rrisk").innerHTML = data.risk;
  document.getElementById("rnext").innerHTML = data.next;
  document.getElementById("raction").innerText = data.action;

  // 绘制雷达图
  const ctx = document.getElementById("radarChart").getContext("2d");
  new Chart(ctx, {
    type: "radar",
    data: {
      labels: ["高潜力·低落地", "安全焦虑·决策回避", "行动很多·方向混乱", "外部依赖·判断失焦"],
      datasets: [{
        label: "你的行为倾向",
        data: [types.fox, types.turtle, types.monkey, types.sheep],
        backgroundColor: "rgba(2, 132, 199, 0.2)",
        borderColor: "rgba(2, 132, 199, 1)",
        borderWidth: 2,
        pointBackgroundColor: "rgba(2, 132, 199, 1)"
      }]
    },
    options: {
      scales: {
        r: {
          angleLines: { color: "#cbd5e1" },
          grid: { color: "#e2e8f0" },
          pointLabels: { font: { size: 11 }, color: "#334155" },
          suggestedMin: 0,
          suggestedMax: Math.max(...Object.values(types)) + 2,
          ticks: { display: false }
        }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });
}
