<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天赋测试 | 找到你的优势领域</title>
    <!-- 引入Chart.js库用于绘制雷达图 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Microsoft YaHei', sans-serif; }
        body { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: #333; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .container { background-color: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 90%; max-width: 800px; padding: 40px; position: relative; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 16px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .question-container { margin: 25px 0; }
        .question-number { font-weight: bold; color: #3498db; margin-bottom: 8px; font-size: 18px; }
        .question-text { font-size: 18px; line-height: 1.6; margin-bottom: 20px; }
        .options { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .option { flex: 1; min-width: 80px; padding: 12px; text-align: center; background: #f1f2f6; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-weight: bold; border: 2px solid #e0e0e0; }
        .option:hover { background: #e3f2fd; }
        .option.selected { background: #3498db !important; color: white; border-color: #2980b9; }
        .scale-labels { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: #7f8c8d; }
        .btn { display: block; width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 20px; }
        .btn:hover { background: #27ae60; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        .progress-bar { height: 8px; background: #ecf0f1; border-radius: 4px; margin: 30px 0; overflow: hidden; }
        .progress { height: 100%; background: #3498db; width: 0%; transition: width 0.5s; }
        /* 结果页新样式 */
        #result-page h2 { text-align: center; color: #e74c3c; margin: 20px 0; }
        .result-section { margin-top: 30px; }
        .result-section h3 { font-size: 22px; color: #2c3e50; border-left: 5px solid #3498db; padding-left: 15px; margin-bottom: 15px; }
        #radar-chart-container { width: 100%; max-width: 450px; margin: 20px auto; }
        .analysis-block { background: #f8f9fa; border-radius: 10px; padding: 20px; margin-bottom: 20px; line-height: 1.7; }
        .analysis-block p { margin-bottom: 10px; }
        .analysis-block strong { color: #2980b9; }
        .analysis-block ul { list-style-type: disc; margin-left: 25px; }
        .restart-btn { background: #e74c3c; margin-top: 30px; }
        .restart-btn:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面1：引言 -->
        <div id="intro-page" class="page active">
            <h1>🌟 天赋测试：找到你的优势领域</h1>
            <p class="subtitle">由职业规划导师精心设计 | 20题快速测评 | 5分钟完成</p>
            <div style="margin: 30px 0; line-height: 1.8;">
                <p>✨ <strong>为什么做这个测试？</strong></p>
                <p>每个人的天赋领域不同，找到它能让你：</p>
                <ul style="margin-left: 30px; margin-top: 10px;">
                    <li>更快进入职业“舒适区”，事半功倍</li>
                    <li>避开不适合的领域，减少无效努力</li>
                    <li>在求职/升学中精准定位优势</li>
                </ul>
                <p style="margin-top: 20px; color: #e74c3c; font-weight: bold;">
                    请根据你的<strong>真实感受</strong>作答（没有标准答案！）
                </p>
            </div>
            <button class="btn" onclick="startTest()">开始测试</button>
        </div>

        <!-- 测试页面 -->
        <div id="test-page" class="page">
            <div class="progress-bar"><div class="progress" id="progress"></div></div>
            <div class="question-container">
                <div class="question-number">题目 <span id="current-q">1</span> / 20</div>
                <div class="question-text" id="question-text"></div>
                <div class="options" id="options-container"></div>
                <div class="scale-labels"><span>1 = 完全不符合我</span><span>5 = 非常符合我</span></div>
            </div>
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>下一题</button>
        </div>

        <!-- 结果页面 -->
        <div id="result-page" class="page">
            <h2>🎯 你的天赋优势分析报告</h2>
            
            <div class="result-section">
                <h3>你的天赋分布雷达图</h3>
                <div id="radar-chart-container">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>

            <div class="result-section">
                <h3>优势解读与职业建议</h3>
                <div id="analysis-results" class="analysis-block"></div>
            </div>

            <div class="result-section">
                <h3>发展建议</h3>
                <div id="development-advice" class="analysis-block"></div>
            </div>

            <button class="btn restart-btn" onclick="restartTest()">重新测试</button>
        </div>
    </div>

    <script>
        // --- 题库和维度映射 (保持不变) ---
        const questions = [
            { id: 1, text: "我擅长通过数据、图表或逻辑推理解决复杂问题。" }, { id: 2, text: "我经常想出新颖的点子或解决方案，别人觉得很有创意。" }, { id: 3, text: "在团队中，我常常是协调者，能化解矛盾让大家合作顺畅。" }, { id: 4, text: "动手操作机械、电子设备或进行手工制作时，我感到非常专注且得心应手。" }, { id: 5, text: "我表达清晰，写作或口头陈述时能准确传达观点，听众容易理解。" }, { id: 6, text: "当团队需要做决定时，我能快速分析利弊并做出果断决策。" }, { id: 7, text: "我对美学、色彩、音乐或艺术创作有浓厚兴趣，且有一定造诣。" }, { id: 8, text: "我能敏锐察觉他人的情绪变化，并主动提供帮助。" }, { id: 9, text: "拆解、组装、修理物品或进行实验时，我享受其中。" }, { id: 10, text: "在公开场合发言或教别人时，我能自信、流畅地表达。" }, { id: 11, text: "我喜欢研究抽象理论、数学公式或科学原理。" }, { id: 12, text: "我能将枯燥的工作转化为有趣的挑战，保持创新。" }, { id: 13, text: "朋友常来找我倾诉烦恼，因为他们认为我能给出好建议。" }, { id: 14, text: "使用工具、编程或进行技术操作时，我进步很快。" }, { id: 15, text: "写作、翻译或讲故事是我的强项，语言组织能力强。" }, { id: 16, text: "在紧急情况下，我能冷静下来，迅速组织资源解决问题。" }, { id: 17, text: "设计（平面、服装、产品等）或表演艺术是我的爱好。" }, { id: 18, text: "我善于说服他人，能影响别人的决定或行为。" }, { id: 19, text: "动手制作模型、修理家电或进行户外探险活动时，我感到满足。" }, { id: 20, text: "我能用简单易懂的语言解释复杂的概念给别人听。" }
        ];
        const dimensionMap = {
            1: "逻辑分析", 2: "创造艺术", 3: "人际影响", 4: "动手实践", 5: "语言表达", 6: "领导决策", 7: "创造艺术", 8: "人际影响", 9: "动手实践", 10: "语言表达", 11: "逻辑分析", 12: "创造艺术", 13: "人际影响", 14: "动手实践", 15: "语言表达", 16: "领导决策", 17: "创造艺术", 18: "人际影响", 19: "动手实践", 20: "语言表达"
        };
        // --- 详细维度解读数据库 (全新) ---
        const dimensionDetails = {
            "逻辑分析": {
                fields: ["数据科学", "金融分析", "科研领域", "软件工程"],
                positions: ["数据分析师", "算法工程师", "金融风控师", "软件开发工程师", "科研助理"],
                analysis: "雷达图显示，您在<strong>逻辑分析</strong>维度得分最高。这表明您天生擅长处理复杂信息，能从海量数据和线索中发现规律，做出理性的判断。您享受用逻辑和规则解决问题的过程。",
                strengthen: "深入学习Python、SQL等数据分析工具；攻读数学、统计学或计算机科学学位；挑战逻辑谜题或参与编程竞赛。",
                mitigate: "若此项为短板，避免纯研究或高度依赖数据分析的岗位。在工作中，多与数据分析能力强的同事协作，学习他们的思维框架，并利用可视化工具辅助决策。"
            },
            "创造艺术": {
                fields: ["设计领域", "内容创作", "市场营销", "文艺创作"],
                positions: ["UI/UX设计师", "广告策划", "新媒体运营", "编剧/作家", "产品概念设计师"],
                analysis: "您在<strong>创造艺术</strong>维度表现突出，说明您拥有丰富的想象力和独特的审美。您不满足于常规，乐于打破框架，用新颖的方式表达自己、解决问题。",
                strengthen: "建立个人作品集；学习Figma、Adobe全家桶等设计软件；多看展览、电影，保持对新鲜事物的敏感度。",
                mitigate: "若此项为短板，在需要创意的场合，可采用“头脑风暴”等结构化方法激发灵感，或与创意型人才搭档。选择执行性、流程化更强的工作会更舒适。"
            },
            "人际影响": {
                fields: ["人力资源", "心理咨询", "教育培训", "销售管理"],
                positions: ["HRBP", "心理咨询师", "企业培训师", "销售总监", "客户关系经理(CRM)"],
                analysis: "您在<strong>人际影响</strong>维度得分很高。这意味着您能敏锐地感知他人情绪和需求，善于沟通、协调和建立信任。您是天生的“连接者”，能将人有效地组织在一起。",
                strengthen: "学习非暴力沟通、NLP（神经语言程序学）；参与辩论或主持活动；多组织团队活动，锻炼协调能力。",
                mitigate: "若此项为短板，可先从一对一的深度沟通练起，而不是直接挑战大规模社交。在工作中，明确自己的角色和任务，用专业能力而非人际手腕来建立权威。"
            },
"动手实践": {
                fields: ["工程技术", "医疗健康", "手工艺", "信息技术"],
                positions: ["机械工程师", "外科医生", "高级技工", "网络工程师", "硬件开发"],
                analysis: "您在<strong>动手实践</strong>维度得分极高。您是典型的“实干家”，相比于空想，您更喜欢亲手将想法变为现实。您在操作工具、设备或进行精细作业时，能获得极大的满足感。",
                strengthen: "参与开源硬件项目（如Arduino）；学习3D打印、木工等技能；考取相关的技术资格证书。",
                mitigate: "若此项为短板，职业规划上应侧重于策略、规划、沟通等“软技能”岗位。避免需要大量一线操作和设备调试的工作。"
            },
            "语言表达": {
                fields: ["媒体/出版", "法律行业", "公共关系", "教育行业"],
                positions: ["记者/编辑", "律师", "公关经理", "教师/讲师", "内容策略师"],
                analysis: "您在<strong>语言表达</strong>维度表现优异。无论是书面写作还是口头沟通，您都能清晰、有条理且富有感染力地传达思想。您擅长用语言来影响和说服他人。",
                strengthen: "坚持写作，开设个人博客或公众号；练习即兴演讲（如Toastmasters）；学习一门新的外语。",
                mitigate: "若此项为短板，沟通时可提前准备提纲和要点，多使用图表和数据辅助表达。在团队中，可以承担更多执行和分析的角色。"
            },
            "领导决策": {
                fields: ["企业管理", "项目管理", "创业", "公共管理"],
                positions: ["部门经理", "项目经理(PM)", "创始人/CEO", "产品负责人(PO)", "战略顾问"],
                analysis: "您在<strong>领导决策</strong>维度得分很高，显示出您具备出色的判断力和责任感。在复杂和不确定的情况下，您能保持冷静，权衡利弊，并勇于承担决策后果。",
                strengthen: "阅读商业领袖传记，学习管理学理论（如MBA课程）；在学生会或社团中担任负责人，主动承担决策角色。",
                mitigate: "若此项为短板，先从管理好个人项目开始，逐步锻炼决策能力。在团队中，可以担当“参谋”角色，为领导者提供分析和建议，学习其决策过程。"
            }
        };

        let answers = {};
        let currentQ = 0;
        let chartInstance = null; // 用于存储图表实例

        function startTest() {
            document.getElementById('intro-page').classList.remove('active');
            document.getElementById('test-page').classList.add('active');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQ];
            document.getElementById('current-q').textContent = currentQ + 1;
            document.getElementById('question-text').textContent = q.text;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            for (let i = 1; i <= 5; i++) {
                const option = document.createElement('div');
                option.className = 'option';
                option.textContent = i;
                option.dataset.value = i;
                if (answers[q.id] === i) { option.classList.add('selected'); }
                option.onclick = function() {
                    document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    answers[q.id] = i;
                    document.getElementById('next-btn').disabled = false;
                };
                optionsContainer.appendChild(option);
            }
            
            const progress = ((currentQ + 1) / questions.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
        }

        function nextQuestion() {
            if (currentQ < questions.length - 1) {
                currentQ++;
                showQuestion();
                document.getElementById('next-btn').disabled = true;
            } else {
                calculateResult();
            }
        }

        function calculateResult() {
            const dimensions = { "逻辑分析": 0, "创造艺术": 0, "人际影响": 0, "动手实践": 0, "语言表达": 0, "领导决策": 0 };
            const dimCount = { "逻辑分析": 0, "创造艺术": 0, "人际影响": 0, "动手实践": 0, "语言表达": 0, "领导决策": 0 };

            for (const qid in answers) {
                const dim = dimensionMap[qid];
                dimensions[dim] += answers[qid];
                dimCount[dim]++;
            }

            const result = {};
            for (const dim in dimensions) {
                const avg = dimensions[dim] / dimCount[dim];
                result[dim] = Math.round((avg / 5) * 100);
            }

            showResult(result);
        }

        function showResult(result) {
            document.getElementById('test-page').classList.remove('active');
            document.getElementById('result-page').classList.add('active');

            const sorted = Object.entries(result).sort((a, b) => b[1] - a[1]);
            const topDimension = sorted[0][0];
            const bottomDimension = sorted[sorted.length - 1][0];

            // 1. 绘制雷达图
            const ctx = document.getElementById('radarChart').getContext('2d');
            if (chartInstance) { chartInstance.destroy(); } // 如果已有图表，先销毁
            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: Object.keys(result),
                    datasets: [{
                        label: '天赋得分',
                        data: Object.values(result),
                        backgroundColor: 'rgba(52, 152, 219, 0.2)',
                        borderColor: 'rgba(52, 152, 219, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(52, 152, 219, 1)'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: '#ccc' },
                            grid: { color: '#ddd' },
                            pointLabels: { font: { size: 14 } },
                            suggestedMin: 0,
                            suggestedMax: 100
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });

            // 2. 生成优势解读与职业建议
            const topInfo = dimensionDetails[topDimension];
            let analysisHTML = `<p>${topInfo.analysis}</p>`;
            analysisHTML += `<p><strong>推荐发展领域：</strong>${topInfo.fields.join('、')}</p>`;
            analysisHTML += `<p><strong>具体参考职位：</strong></p><ul>`;
            topInfo.positions.forEach(pos => { analysisHTML += `<li>${pos}</li>`; });
            analysisHTML += `</ul>`;
            document.getElementById('analysis-results').innerHTML = analysisHTML;

            // 3. 生成发展建议
            const bottomInfo = dimensionDetails[bottomDimension];
            let adviceHTML = `<p><strong>强化你的优势 (${topDimension})：</strong>${topInfo.strengthen}</p>`;
            adviceHTML += `<p><strong>管理你的短板 (${bottomDimension})：</strong>${bottomInfo.mitigate}</p>`;
            adviceHTML += `<p><strong>综合建议：</strong>职业发展的核心是“扬长避短”。请将80%的精力投入到你最擅长的<strong>${topDimension}</strong>领域，让它成为你不可替代的标签。同时，了解自己在<strong>${bottomDimension}</strong>方面的局限，通过团队协作或工具来弥补，而不是耗费大量精力去“补短板”。</p>`;
            document.getElementById('development-advice').innerHTML = adviceHTML;
        }

        function restartTest() {
            answers = {};
            currentQ = 0;
            document.getElementById('result-page').classList.remove('active');
            document.getElementById('intro-page').classList.add('active');
        }
    </script>
</body>
</html>
